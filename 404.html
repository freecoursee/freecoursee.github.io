<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة | freecoursee</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Tajawal,system-ui,Tahoma,sans-serif;background:#f5f7fb;color:#1b2430;text-align:center;padding:24px}
h1{font-size:64px;margin:0;color:#0f766e} p{color:#5d6b7e;font-size:18px}
a{display:inline-block;margin-top:12px;background:#0f766e;color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none}
@media(prefers-color-scheme:dark){body{background:#0f1720;color:#e6edf3}p{color:#9aa8b8}}
</style>
</head>
<body>
<div>
<h1>404</h1>
<p>الصفحة اللي تدور عليها غير موجودة أو انتقلت.</p>
<a id="home" href="index.html">الرجوع للرئيسية</a>
</div>
<script>
(function(){var h=location.hostname,p=location.pathname.split('/').filter(Boolean);
if(/\.github\.io$/.test(h)&&p.length){document.getElementById('home').href='/'+p[0]+'/';}
else{document.getElementById('home').href='/';}})();
</script>
</body>
</html>
